<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pylint Analysis Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f8f9fa;
        }

        h1 {
            color: #253858;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background-color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #253858;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Pylint Analysis Report</h1>

    <p><strong>Source:</strong>
        reports/pylint_final.json
    </p>

    <p><strong>Total issues detected:</strong> 0</p>

    <table>
        <tr>
            <th>Type</th>
            <th>Rule</th>
            <th>Message</th>
            <th>Line</th>
        </tr>
        <tr><td colspan="4">No issues found</td></tr>
    </table>
</body>
</html>
